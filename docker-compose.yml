version: "3.8"
services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    image: ai-resume-screener-backend:latest
    container_name: ai_resume_backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    image: ai-resume-screener-frontend:latest
    container_name: ai_resume_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
