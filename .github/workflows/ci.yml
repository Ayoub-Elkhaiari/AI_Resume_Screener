name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: pytest -q

    - name: Build backend docker image
      run: docker build -t ai-resume-screener-backend -f backend.Dockerfile .

    - name: Build frontend docker image
      run: docker build -t ai-resume-screener-frontend -f frontend.Dockerfile .
